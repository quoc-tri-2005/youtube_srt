<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ghép phụ đề SRT</title>

    <link
        rel="stylesheet"
        href="merge.css"
    >
</head>

<body>

    <div class="wrapper">

        <div class="top">

            <a
                href="index.html"
                class="back-btn"
            >
                ⬅ Quay về
            </a>

            <h1>
                Ghép phụ đề SRT
            </h1>

            <p>
                Ghép file gốc với file đã dịch theo số thứ tự Subtitle
            </p>

        </div>

        <!-- ========================= -->

        <div class="container">

            <div class="panel">

                <h2>
                    📄 File gốc
                </h2>

                <textarea
                    id="original"
                    placeholder="Dán file SRT gốc..."
                ></textarea>

            </div>

            <div class="panel">

                <h2>
                    🌐 File đã dịch
                </h2>

                <textarea
                    id="translated"
                    placeholder="Dán file đã dịch..."
                ></textarea>

            </div>

        </div>

        <!-- ========================= -->

        <div class="options">

            <label>

                <input
                    type="checkbox"
                    id="enableWrap"
                    checked
                >

                Tự động xuống dòng

            </label>

            <input
                type="number"
                id="maxLen"
                value="32"
                min="10"
                max="100"
            >

            <label>

                <input
                    type="checkbox"
                    id="keepOriginal"
                    checked
                >

                Giữ nguyên tiếng gốc nếu thiếu bản dịch

            </label>

        </div>

        <!-- ========================= -->

        <div class="buttons">

            <button
                class="merge-btn"
                onclick="merge()"
            >
                🔄 Ghép phụ đề
            </button>

            <button
                onclick="copyResult()"
            >
                📋 Copy kết quả
            </button>

            <button
                onclick="downloadSRT()"
            >
                💾 Tải SRT
            </button>

        </div>

        <!-- ========================= -->

        <div class="summary">

            <div class="card">

                <span class="title">
                    Tổng Subtitle
                </span>

                <span
                    class="value"
                    id="totalCount"
                >
                    0
                </span>

            </div>

            <div class="card">

                <span class="title">
                    Đã ghép
                </span>

                <span
                    class="value success"
                    id="mergedCount"
                >
                    0
                </span>

            </div>

            <div class="card">

                <span class="title">
                    Thiếu
                </span>

                <span
                    class="value warning"
                    id="missingCount"
                >
                    0
                </span>

            </div>

            <div class="card">

                <span class="title">
                    Dư
                </span>

                <span
                    class="value danger"
                    id="extraCount"
                >
                    0
                </span>

            </div>

        </div>

        <!-- ========================= -->

        <div class="report">

            <div class="report-box">

                <h3>
                    ⚠ Subtitle bị bỏ sót
                </h3>

                <textarea
                    id="missingList"
                    readonly
                    placeholder="Không có"
                ></textarea>

            </div>

            <div class="report-box">

                <h3>
                    ⚠ Subtitle dư
                </h3>

                <textarea
                    id="extraList"
                    readonly
                    placeholder="Không có"
                ></textarea>

            </div>

        </div>

        <!-- ========================= -->

        <div class="result-area">

            <h2>
                ✅ Kết quả
            </h2>

            <textarea
                id="result"
                placeholder="Kết quả sau khi ghép..."
            ></textarea>

        </div>

    </div>

    <script src="merge.js"></script>

</body>

</html>
